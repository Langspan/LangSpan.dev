name: Coverage
# Line coverage of the workspace on every push to main and every night,
# held to a floor (scripts/coverage.sh, scripts/coverage-report.py;
# docs/development-process.md#coverage). Not a required check. The push
# runs give the gate figures for current main, which a baseline row is
# written from. A pull request that changes the measurement runs it too, so
# the change shows its own result.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage.sh
      - scripts/coverage-report.py
      - scripts/coverage-baseline.tsv
# No token permission unless a job asks for it; only nightly-report writes,
# and only issues.
permissions: {}
env:
  CARGO_INCREMENTAL: 0
concurrency:
  group: coverage-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  coverage:
    name: Coverage
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # A cold build of the instrumented tests, cargo-nextest and
    # cargo-llvm-cov, then the whole suite once.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
          rustc --version
      - name: Install the test runner and cargo-llvm-cov
        run: |
          bash scripts/install-ci-tools.sh "$HOME/.cache/langspan-ci-tools" cargo-nextest cargo-llvm-cov
          echo "$HOME/.cache/langspan-ci-tools" >> "$GITHUB_PATH"
      - name: Measure coverage and compare it with the baseline
        run: bash scripts/coverage.sh target/coverage
      - name: Publish the per-file table
        if: always()
        run: |
          if [ -f target/coverage/report.md ]; then
            cat target/coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report: the run stopped before it." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The exports and table, for raising the baseline from a nightly run
      # (docs/development-process.md#coverage).
      - name: Keep the coverage exports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            target/coverage/report.md
            target/coverage/production.lcov
            target/coverage/all.lcov
          if-no-files-found: warn
          retention-days: 14
  # A failed nightly run, under the floor or with a failing test, opens the
  # nightly issue check.yml uses, or comments on it while it is open. Only
  # this job can write, and only issues; it checks out nothing and runs no
  # repository code. The body is only the commit and the run's link.
  nightly-report:
    name: Nightly coverage report
    needs: [coverage]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly Rust checks on main failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body=$(printf 'The nightly coverage run failed on main at %s: coverage fell under the floor, or a test failed.\n\nRun: %s\n\nThe run summary has the per-file table and names what fell. Fix it the same day; a deliberate drop lowers that file'"'"'s baseline row in a pull request that says why (docs/development-process.md#coverage).' "$SHA" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
