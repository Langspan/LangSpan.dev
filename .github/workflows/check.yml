name: Rust checks
on:
  pull_request:
  # The merge queue's commits: each pull request on top of main and of
  # every pull request queued ahead of it, under the same job names.
  merge_group:
  push:
    branches: [main]
  # The release workflow starts this on release-please's branch: a pull
  # request opened with GITHUB_TOKEN starts no pull_request run of its own.
  # `cold` restores no cache, to measure a build from nothing
  # (docs/evidence/ci); off main, a manual run saves nothing.
  workflow_dispatch:
    inputs:
      cold:
        description: Restore no build cache
        type: boolean
        default: false
      # A dry run of job main-red: it reports the run below (or this one)
      # as a failure of the platform named, and prints the issue instead
      # of filing it.
      main_red_dry_run:
        description: Print the main-red issue for this platform instead of filing it
        type: choice
        options: ["off", Linux, macOS]
        default: "off"
      main_red_run:
        description: The run id the dry run reports on (default this run)
        type: string
        default: ""
  # Every night on main (schedules run on the default branch), with the
  # benchmark harness's dry runs whatever changed. A failure opens or
  # updates one issue (job nightly-report).
  schedule:
    - cron: "23 3 * * *"
# No token permission unless a job asks for it; each job reads only, except
# the reports flaky-report, nightly-report and main-red, which write issues.
permissions: {}
env:
  # Line numbers in backtraces and no other debug info. Measured on an
  # Apple M6 at two jobs: rebuilding the workspace's tests took 17.7 s
  # instead of 21.2 s, and a clean target directory 1.4 GB instead of
  # 1.6 GB (so a smaller cache). Local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # No incremental compilation data: a CI job builds each crate once, and
  # the build cache doesn't keep it. The cache action used before set this
  # itself.
  CARGO_INCREMENTAL: 0
  # scripts/check.sh: the merge queue, a push to main and a manual run (as
  # the release workflow starts on its branch) run the demonstration on the
  # debug binary the tests built; a pull request's fast lane leaves it to
  # the queue. Nothing reads a release binary there, and the release
  # workflow builds its own, so only the nightly run also builds the release
  # binary and runs the demonstration on it, once a day.
  LANGSPAN_CHECK_RELEASE: ${{ github.event_name == 'schedule' }}
  # The lanes (docs/development-process.md#which-tests-run-when). A pull
  # request runs the fast lane on Linux: format, dependency policy, lint
  # and the tests nextest's `ci-fast` profile selects; the macOS check
  # passes at once there. A merge-queue commit, main, the nightly run and a
  # manual run take the full lane on both: every test (`ci` profile) and
  # the demonstration. The merge queue is the gate, so nothing reaches main
  # without the full lane. The full lane builds once per platform (the
  # `build` lane: every check but the tests, which it archives) and runs the
  # archived tests in parallel shards (the `shard` lane, jobs linux-tests
  # and macos-tests); the required checks Linux and macOS pass only when the
  # build and every shard passed (scripts/ci-shard-results.sh).
  LANGSPAN_CHECK_LANE: ${{ github.event_name == 'pull_request' && 'fast' || 'build' }}
  # tests/auto_checks.rs runs real cargo, go and pytest checks. Without a
  # runner a test skips locally and says so; here it fails instead, so a
  # green run means they ran (the steps below install Go and pytest).
  LANGSPAN_REQUIRE_TOOLS: "1"
  # cargo-nextest (.config/nextest.toml) writes
  # target/nextest/<profile>/junit.xml. No retry on a pull request, so a
  # flaky test shows there; two in the merge queue and on main, so one
  # flaky test doesn't eject a healthy pull request. A test that passed
  # only on retry is named in the job summary, and on main in an issue
  # (flaky-report).
  NEXTEST_PROFILE: ${{ github.event_name == 'pull_request' && 'ci-fast' || 'ci' }}
  NEXTEST_RETRIES: ${{ github.event_name == 'pull_request' && '0' || '2' }}
  # The build cache: the crates registry, the compiled dependencies in
  # target/ (main prunes the workspace's own crates before saving) and the
  # cargo-nextest binary. Each job restores it; only main saves it
  # (docs/security/threat-model.md#ci-build-cache). The key names the
  # runner's OS and architecture, the job, the toolchain, the lockfile and
  # the tool versions; bump `v1` in it to drop every entry.
  # actions/cache versions an entry by this path list, so changing the list
  # empties the build cache for every branch until the change reaches main:
  # do it in a pull request of its own. Another tool gets its own cache
  # step, as cargo-audit does.
  CACHE_PATHS: |
    ~/.cargo/registry/index
    ~/.cargo/registry/cache
    ~/.cargo/git/db
    target
    ~/.cache/langspan-ci-tools/cargo-nextest
  CACHE_LIMIT_MB: 2048
# One group per event and commit (per pull request for a pull request), so
# the push to main never waits for, or replaces, the merge-queue run of the
# same commit, nor the nightly run a push's. Only a newer push to a pull
# request cancels its older run; every commit on main keeps its own result.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The names of the jobs linux-result and macos-result, `Linux` and `macOS`,
# are the check names a ruleset requires: keep them stable. The build and
# shard jobs report under names of their own (`Linux build`, `Linux tests
# 1`...), which a ruleset need not list.
#
# Runners come from the repository variables LINUX_RUNNER and MACOS_RUNNER,
# so the owner can move a job to a larger (billed) runner without a code
# change; unset, each job takes GitHub's standard runner.
#
# Time limits by lane: a build job gets 35 minutes in the merge queue and
# 30 on main and nightly (the nightly run also builds the release binary;
# a cold run compiles cargo-nextest and cargo-audit too), and a shard 15.
# The targets are far lower (docs/development-process.md); these limits
# only stop a hung run. The fast
# lane gets 10, not the 6 its 3-minute target suggests, because building
# cargo-nextest or cargo-audit when its cache misses takes minutes on a
# standard runner (scripts/install-ci-tools.sh).
jobs:
  linux:
    name: Linux build
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || github.event_name == 'merge_group' && 35 || 30 }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      dry_runs: ${{ steps.changes.outputs.dry_runs }}
    steps:
      # Two commits deep: a pull request's run checks out the merge commit,
      # whose first parent is the base, so the change is HEAD^1..HEAD with
      # no further fetch (none could authenticate without kept credentials).
      # A merge-queue commit can sit several commits above its group's base,
      # one per pull request queued ahead, so that run fetches all history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      # Whether the change is code at all, and whether the benchmark dry
      # runs are needed: the script says why.
      - name: Decide what the change touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci-changes.sh
      # rustup 1.28 and later no longer install the toolchain on first use;
      # with no argument this installs the one rust-toolchain.toml names.
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      # The cache keys, named apart from the restores: a cold manual run
      # skips those, and a skipped step has no outputs, so the saves below
      # read their keys from here. A cold run on main therefore still saves
      # an entry main lacks.
      - name: Name the cache keys
        id: keys
        if: steps.changes.outputs.code == 'true'
        env:
          BUILD_PREFIX: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
          BUILD_HASH: ${{ hashFiles('Cargo.lock', 'scripts/install-ci-tools.sh') }}
          AUDIT_PREFIX: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          AUDIT_HASH: ${{ hashFiles('scripts/install-ci-tools.sh') }}
        run: |
          {
            echo "build-prefix=$BUILD_PREFIX"
            echo "build=$BUILD_PREFIX$BUILD_HASH"
            echo "audit-prefix=$AUDIT_PREFIX"
            echo "audit=$AUDIT_PREFIX$AUDIT_HASH"
          } >> "$GITHUB_OUTPUT"
      # Every run falls back to main's latest entry for the same toolchain
      # when none is under its exact key, so a lockfile change rebuilds only
      # the crates it changed; main too, which then saves the result under
      # the new key. Every entry is main's own (only main saves), so a
      # fallback brings in nothing else (docs/security/threat-model.md#ci-build-cache).
      # A cold manual run restores nothing.
      - name: Restore the build cache
        id: cache
        if: steps.changes.outputs.code == 'true' && !inputs.cold
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.keys.outputs.build }}
          restore-keys: ${{ steps.keys.outputs.build-prefix }}
      # cargo-audit is built, not downloaded, so it is cached too, in an
      # entry of its own that leaves CACHE_PATHS alone. The same rules: only
      # main saves, and every run falls back to main's latest entry.
      - name: Restore cargo-audit
        id: audit-cache
        if: steps.changes.outputs.code == 'true' && !inputs.cold
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/langspan-ci-tools/cargo-audit
          key: ${{ steps.keys.outputs.audit }}
          restore-keys: ${{ steps.keys.outputs.audit-prefix }}
      - name: Install the dependency policy, advisory and unused-dependency checkers and the test runner
        id: tools
        if: steps.changes.outputs.code == 'true'
        run: |
          bash scripts/install-ci-tools.sh "$HOME/.cache/langspan-ci-tools"
          echo "$HOME/.cache/langspan-ci-tools" >> "$GITHUB_PATH"
      # No test sleeps a fixed 200 ms or more beyond the per-file counts in
      # scripts/fixed-sleeps.tsv, which only go down (issue #310). Every
      # lane, on Linux only: the check reads source, not the platform.
      - name: Check for fixed sleeps in tests
        if: steps.changes.outputs.code == 'true'
        run: python3 -I -B scripts/fixed-sleeps.py tests
      - name: Check formatting, dependencies, lint, real integration tests and the demonstration
        if: steps.changes.outputs.code == 'true'
        env:
          # `skip` or `run`; tests/benchmark_harness.rs skips on `skip` only.
          LANGSPAN_BENCH_DRY_RUNS: ${{ steps.changes.outputs.dry_runs }}
          LANGSPAN_TEST_ARCHIVE: ${{ runner.temp }}/tests.tar.zst
        run: sh scripts/check.sh
      # The fast lane ran its tests here; the full lane's run in the shards.
      - name: Name the tests that passed only on retry
        if: always() && steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: python3 -I -B scripts/flaky-tests.py "target/nextest/$NEXTEST_PROFILE/junit.xml"
      - name: Keep the JUnit report
        if: always() && steps.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
      # The archive and the cargo-nextest that made it, for this run's
      # shards: they test exactly what this job built, and build nothing.
      # Already compressed, so stored as is, and kept a day.
      - name: Put the test runner beside the test archive
        if: steps.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        run: cp "$HOME/.cache/langspan-ci-tools/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
      - name: Keep the test archive for the shards
        if: steps.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linux
          path: |
            ${{ runner.temp }}/tests.tar.zst
            ${{ runner.temp }}/cargo-nextest
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # After a run on main that found no entry under its key, whether its
      # checks passed or failed: drop what the next run rebuilds anyway
      # (the workspace's own crates, the release build, test reports), then
      # save if within the limit. A failed test leaves main's own build
      # output, which is what the entry holds. Not after a cancelled or
      # timed-out run, or one whose checks never built the tests: its
      # target directory may be partial, and an entry is never replaced.
      - name: Prune the build cache and check its size
        id: size
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.changes.outputs.code == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          LIMIT_MB: ${{ env.CACHE_LIMIT_MB }}
        run: bash scripts/ci-cache-prune.sh
      - if: ${{ !cancelled() && steps.size.outputs.save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.keys.outputs.build }}
      - name: Save cargo-audit
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.tools.outcome == 'success' && steps.audit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/langspan-ci-tools/cargo-audit
          key: ${{ steps.keys.outputs.audit }}
  # The full lane's tests, in shards of the archive the build job made:
  # scripts/ci-shards.py gives each test to one shard by the measured times
  # in scripts/ci-test-times.tsv, so every test runs exactly once and each
  # shard gets an even share of the measured test time
  # (docs/evidence/ci/balance.md). Four shards, from the measured test time
  # (docs/evidence/ci/shards.md); a fifth would mostly wait on the slowest
  # benchmark dry run. Each shard runs on its own standard runner, under the
  # foreign home, with retries and reports as the unsharded run had.
  linux-tests:
    name: Linux tests ${{ matrix.shard }}
    needs: [linux]
    if: needs.linux.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      # The tests run real cargo and rustfmt (tests/auto_checks.rs,
      # tests/shell_concurrent_edits.rs), and nextest runs through cargo.
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-linux
          path: ${{ runner.temp }}
      # An artifact keeps no file mode.
      - name: Put the test runner on PATH
        run: |
          chmod 0755 "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Go and pytest for the tests in tests/auto_checks.rs that run a real
      # `go test` and pytest; LANGSPAN_REQUIRE_TOOLS fails them without
      # these. Only the full lane runs those tests. pytest goes into a
      # virtual environment whose python3 comes first on PATH.
      - name: Install Go for the real go test check
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install pytest for the real pytest check
        run: |
          python3 -m venv "$RUNNER_TEMP/pytest"
          "$RUNNER_TEMP/pytest/bin/python3" -m pip install --disable-pip-version-check pytest==8.4.2
          echo "$RUNNER_TEMP/pytest/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pytest/bin/python3" -m pytest --version
          go version
      - name: Run this shard of the tests
        env:
          LANGSPAN_CHECK_LANE: shard
          LANGSPAN_TEST_ARCHIVE: ${{ runner.temp }}/tests.tar.zst
          LANGSPAN_TEST_PARTITION: time:${{ matrix.shard }}/${{ strategy.job-total }}
          LANGSPAN_BENCH_DRY_RUNS: ${{ needs.linux.outputs.dry_runs }}
        run: sh scripts/check.sh
      # No test took over 10 s unless it is named `slow_…` (issue #311,
      # docs/development-process.md#slow-tests). It reports without failing
      # the job until the slow tests in files this change left alone (the
      # benchmark harness, between_steps, the Codex capture, four in
      # graph.rs and one unit test) are shortened or named.
      - name: Check that no untagged test took over 10 s
        if: success()
        continue-on-error: true
        run: python3 -I -B scripts/slow-tests.py target/nextest/ci/junit.xml
      - name: Name the tests that passed only on retry
        if: always()
        run: python3 -I -B scripts/flaky-tests.py "target/nextest/$NEXTEST_PROFILE/junit.xml"
      - name: Keep the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux-${{ matrix.shard }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
  # The required check `Linux`: it passes only when the build job and every
  # shard passed, or when no shard was meant to run (a pull request's fast
  # lane, or a change that touches no code). It runs whatever they ended
  # with, so a failed, cancelled or timed-out part fails it rather than
  # leaving it skipped. It names the shards' flaky tests for flaky-report.
  linux-result:
    name: Linux
    needs: [linux, linux-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      flaky: ${{ steps.result.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.linux-tests.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-linux-*
          path: ${{ runner.temp }}/junit
      - name: Pass only when the build and every shard passed
        id: result
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.linux.outputs.code }}
          BUILD: ${{ needs.linux.result }}
          TESTS: ${{ needs.linux-tests.result }}
        run: bash scripts/ci-shard-results.sh "$RUNNER_TEMP/junit"
  # The same check on Apple silicon, in the full lane only. `macos-26` is
  # GitHub's current arm64 image (`macos-latest` points at it); a pinned
  # label, so an image change is a deliberate edit here. It starts with
  # Linux, not after it, and decides what the change touches for itself,
  # the same way.
  #
  # On a pull request the job passes at once on a standard Linux runner and
  # says why: the check reports in seconds, no macOS runner is
  # started, and the full macOS run happens on the merge-queue commit. It
  # passes rather than skips, so it reports a result either way, and so
  # does macos-result after it. In the full lane it builds and archives the
  # tests as Linux does, and macos-tests runs them in shards.
  macos:
    name: macOS build
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || github.event_name == 'merge_group' && 35 || 30 }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      dry_runs: ${{ steps.changes.outputs.dry_runs }}
    steps:
      - name: Pass a pull request at once
        if: github.event_name == 'pull_request'
        run: |
          line="Pull request: the full macOS run happens in the merge queue, on the commit that would merge."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      - if: github.event_name != 'pull_request'
        name: Decide what the change touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash scripts/ci-changes.sh
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      # As on Linux, apart from the restore, which a cold run skips.
      - name: Name the cache keys
        id: keys
        if: steps.changes.outputs.code == 'true'
        env:
          BUILD_PREFIX: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-
          BUILD_HASH: ${{ hashFiles('Cargo.lock', 'scripts/install-ci-tools.sh') }}
        run: |
          {
            echo "build-prefix=$BUILD_PREFIX"
            echo "build=$BUILD_PREFIX$BUILD_HASH"
          } >> "$GITHUB_OUTPUT"
      # The build cache as on Linux: macOS keeps entries of its own (the key
      # names the job and platform), every run falls back to main's latest,
      # and only main saves them.
      - name: Restore the build cache
        id: cache
        if: steps.changes.outputs.code == 'true' && !inputs.cold
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.keys.outputs.build }}
          restore-keys: ${{ steps.keys.outputs.build-prefix }}
      # Only the test runner: format, dependency policy, advisories, unused
      # dependencies and the docs don't depend on the platform, so only
      # Linux runs them (LANGSPAN_CHECK_PORTABLE below).
      - name: Install the test runner
        if: steps.changes.outputs.code == 'true'
        run: |
          bash scripts/install-ci-tools.sh "$HOME/.cache/langspan-ci-tools" cargo-nextest
          echo "$HOME/.cache/langspan-ci-tools" >> "$GITHUB_PATH"
      # Without the portable checks, which Linux runs; the name stays as on
      # Linux, which scripts/measure-ci.sh finds the step by.
      - name: Check formatting, dependencies, lint, real integration tests and the demonstration
        if: steps.changes.outputs.code == 'true'
        env:
          LANGSPAN_BENCH_DRY_RUNS: ${{ steps.changes.outputs.dry_runs }}
          LANGSPAN_TEST_ARCHIVE: ${{ runner.temp }}/tests.tar.zst
          LANGSPAN_CHECK_PORTABLE: "false"
        run: sh scripts/check.sh
      # As on Linux.
      - name: Put the test runner beside the test archive
        if: steps.changes.outputs.code == 'true'
        run: cp "$HOME/.cache/langspan-ci-tools/cargo-nextest" "$RUNNER_TEMP/cargo-nextest"
      - name: Keep the test archive for the shards
        if: steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-macos
          path: |
            ${{ runner.temp }}/tests.tar.zst
            ${{ runner.temp }}/cargo-nextest
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      # As on Linux: after a run on main that passed or failed, not one
      # cancelled or timed out.
      - name: Prune the build cache and check its size
        id: size
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.changes.outputs.code == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          LIMIT_MB: ${{ env.CACHE_LIMIT_MB }}
        run: bash scripts/ci-cache-prune.sh
      - if: ${{ !cancelled() && steps.size.outputs.save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.keys.outputs.build }}
  # The macOS shards, as on Linux. Four, so a run holds at most four macOS
  # runners at once (docs/evidence/ci/shards.md).
  macos-tests:
    name: macOS tests ${{ matrix.shard }}
    needs: [macos]
    if: needs.macos.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-macos
          path: ${{ runner.temp }}
      - name: Put the test runner on PATH
        run: |
          chmod 0755 "$RUNNER_TEMP/cargo-nextest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Go for the real go test check
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install pytest for the real pytest check
        run: |
          python3 -m venv "$RUNNER_TEMP/pytest"
          "$RUNNER_TEMP/pytest/bin/python3" -m pip install --disable-pip-version-check pytest==8.4.2
          echo "$RUNNER_TEMP/pytest/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pytest/bin/python3" -m pytest --version
          go version
      - name: Run this shard of the tests
        env:
          LANGSPAN_CHECK_LANE: shard
          LANGSPAN_TEST_ARCHIVE: ${{ runner.temp }}/tests.tar.zst
          LANGSPAN_TEST_PARTITION: time:${{ matrix.shard }}/${{ strategy.job-total }}
          LANGSPAN_BENCH_DRY_RUNS: ${{ needs.macos.outputs.dry_runs }}
        run: sh scripts/check.sh
      - name: Name the tests that passed only on retry
        if: always()
        run: python3 -I -B scripts/flaky-tests.py "target/nextest/$NEXTEST_PROFILE/junit.xml"
      - name: Keep the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-macos-${{ matrix.shard }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
  # The check `macOS`, as `Linux` is made.
  macos-result:
    name: macOS
    needs: [macos, macos-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      flaky: ${{ steps.result.outputs.flaky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.macos-tests.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-macos-*
          path: ${{ runner.temp }}/junit
      - name: Pass only when the build and every shard passed
        id: result
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.macos.outputs.code }}
          BUILD: ${{ needs.macos.result }}
          TESTS: ${{ needs.macos-tests.result }}
        run: bash scripts/ci-shard-results.sh "$RUNNER_TEMP/junit"
  # A test that passed only on retry on main opens one issue, or comments
  # on it while it is open, naming the tests. Only this job can write, and
  # only issues; it checks out nothing and runs no repository code. The
  # names come from the two result jobs' outputs, through the environment.
  flaky-report:
    name: Flaky test report
    needs: [linux-result, macos-result]
    if: always() && github.ref == 'refs/heads/main' && (needs.linux-result.outputs.flaky != '' || needs.macos-result.outputs.flaky != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the flaky test issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Flaky tests seen on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          LINUX_FLAKY: ${{ needs.linux-result.outputs.flaky }}
          MACOS_FLAKY: ${{ needs.macos-result.outputs.flaky }}
        run: |
          # One line per test: "- `binary test` (Linux)".
          list() {
            printf '%s\n' "$2" | while IFS= read -r name; do
              if [ -n "$name" ]; then printf -- '- `%s` (%s)\n' "$name" "$1"; fi
            done
          }
          body=$(printf 'These tests failed a try and then passed on main at %s, so the run passed.\n\n%s\n%s\n\nRun: %s\n\nGive each a deterministic fix the same day (docs/development-process.md).' \
            "$SHA" "$(list Linux "$LINUX_FLAKY")" "$(list macOS "$MACOS_FLAKY")" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
  # A nightly run that fails opens one issue, or comments on it while it is
  # still open, so the failure isn't missed. Only this job can write, and
  # only issues; it checks out nothing and runs no repository code. The
  # title is fixed text and the body only the commit and the run's link.
  nightly-report:
    name: Nightly failure report
    needs: [linux-result, macos-result]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly Rust checks on main failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body=$(printf 'The nightly Rust checks failed on main at %s.\n\nRun: %s\n\nThe nightly run includes the benchmark harness dry runs, which pull requests skip when they touch no benchmark, briefing, hook or daemon code, and checks the unchanged lockfile against the latest RustSec advisories with cargo-deny and cargo-audit; the job log names any new advisory. Fix the failure the same day (docs/development-process.md).' "$SHA" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            # No label: a missing label would fail the create and lose
            # the report.
            gh issue create --title "$TITLE" --body "$body"
          fi
  # macOS is optional in the merge queue (owner decision on #487), so a
  # macOS failure can reach main; a Linux one can too, as a flaky test or a
  # change the queue didn't see. After every push to main, for each
  # platform, scripts/ci-main-red.py opens the issue "main-red: <platform>
  # checks failing on main" when that platform's check failed or was
  # cancelled, or comments on it while it is open, and closes it with the
  # green run's link once the check passes. Nothing is reverted. The token
  # writes only issues; it reads the run's jobs, logs and JUnit reports and
  # the commits since the last green run as public data. Log lines and test
  # names reach the issue capped and quoted as data. A manual run with
  # main_red_dry_run reports a failure of the run main_red_run names and
  # prints the issue instead of filing it.
  main-red:
    name: main-red ${{ matrix.platform }}
    needs: [linux-result, macos-result]
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.main_red_dry_run == 'Linux' || inputs.main_red_dry_run == 'macOS')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    concurrency:
      group: main-red-${{ github.event_name }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        platform: [Linux, macOS]
    steps:
      - if: github.event_name == 'push' || inputs.main_red_dry_run == matrix.platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or close the platform's main-red issue
        if: github.event_name == 'push' || inputs.main_red_dry_run == matrix.platform
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          RESULT: ${{ github.event_name == 'workflow_dispatch' && 'failure' || (matrix.platform == 'Linux' && needs.linux-result.result || needs.macos-result.result) }}
          RUN_ID: ${{ inputs.main_red_run || github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 -I -B scripts/ci-main-red.py
  # zizmor audits the workflows and dependabot.yml: injection, over-broad
  # permissions, credential persistence, unpinned or impostor action
  # commits. Its online audits read public GitHub data with this job's
  # read-only token.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.33.1 zizmor --format github .
