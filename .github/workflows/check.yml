name: Rust checks
on:
  pull_request:
  # The merge queue's commits: each pull request on top of main and of
  # every pull request queued ahead of it, under the same job names.
  merge_group:
  push:
    branches: [main]
  # The release workflow starts this on release-please's branch: a pull
  # request opened with GITHUB_TOKEN starts no pull_request run of its own.
  workflow_dispatch:
  # Every night on main (schedules run on the default branch), with the
  # benchmark harness's dry runs whatever changed. A failure opens or
  # updates one issue (job nightly-report).
  schedule:
    - cron: "23 3 * * *"
# No token permission unless a job asks for it; each job reads only, except
# nightly-report, which writes issues.
permissions: {}
env:
  # Line numbers in backtraces and no other debug info. Measured on an
  # Apple M6 at two jobs: rebuilding the workspace's tests took 17.7 s
  # instead of 21.2 s, and a clean target directory 1.4 GB instead of
  # 1.6 GB (so a smaller cache). Local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # scripts/check.sh: a pull request or merge-queue commit runs the
  # demonstration on the debug binary only; main and manual runs also build
  # the release binary and run it again on that.
  LANGSPAN_CHECK_RELEASE: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
# A newer push to a pull request cancels its older run. Runs on main are
# never cancelled, so every commit on main keeps its own result; the nightly
# run has a group of its own, so it never replaces a push's pending run.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Job names are the check names a ruleset requires: keep them stable.
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      dry_runs: ${{ steps.changes.outputs.dry_runs }}
    steps:
      # Two commits deep: a pull request's run checks out the merge commit,
      # whose first parent is the base, so the change is HEAD^1..HEAD with
      # no further fetch (none could authenticate without kept credentials).
      # A merge-queue commit can sit several commits above its group's base,
      # one per pull request queued ahead, so that run fetches all history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'merge_group' && 2 || 0 }}
      # A pull request or merge-queue commit that changes only Markdown
      # builds nothing: no test or build step reads a .md file. Other files
      # under docs/ count as code, since a test replays a recorded host
      # session kept in docs/evidence/.
      # The jobs still run and pass, so a required check is never left
      # waiting, as it would be with a workflow-level paths filter. Pushes
      # to main, manual runs and the nightly run always check.
      #
      # The benchmark harness's dry runs (tests/benchmark_harness.rs) took
      # about 11 minutes of macOS's 18 (issue #286). They run only when the
      # change touches a path in BENCH_PATHS: the harness, the briefing,
      # hook and daemon code it drives, and what builds or runs the suite.
      # A pull request is HEAD^1..HEAD. A merge-queue commit is its group's
      # base..head, so the pull requests queued ahead count too. A push to
      # main is HEAD^1..HEAD when it adds one commit (a squash merge), and
      # otherwise runs them. Manual and nightly runs always run them.
      # Anything unsure runs them.
      - name: Decide what the change touches
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BENCH_PATHS: >-
            ^benchmarks/
            |^tests/benchmark_harness\.rs$
            |^src/(daemon|hook|claude_code|recent)\.rs$
            |^src/hook/
            |^crates/langspan-core/src/lib\.rs$
            |^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$
            |^\.github/workflows/check\.yml$
            |^scripts/(check|test-foreign-home)\.sh$
        run: |
          # A failed git command stops the step (bash -e) instead of
          # reading as "nothing changed".
          code=true
          dry_runs=run
          from=
          to=HEAD
          if [ "$EVENT" = pull_request ]; then
            from=HEAD^1
          elif [ "$EVENT" = merge_group ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            from=$BASE_SHA
            to=$HEAD_SHA
          elif [ "$EVENT" = push ] && [ "$(git rev-parse HEAD^1)" = "$BEFORE" ]; then
            from=HEAD^1
          fi
          if [ -n "$from" ]; then
            changed=$(git diff --name-only "$from" "$to")
            if [ "$EVENT" != push ] && [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '\.md$' | grep -q .; then
              code=false
            fi
            pattern=$(printf '%s' "$BENCH_PATHS" | tr -d ' ')
            # grep exits 1 for no match; anything else (a bad pattern)
            # stops the step rather than skip the dry runs.
            matches=$(grep -Ec -- "$pattern" <<< "$changed") || [ $? -eq 1 ]
            if [ -n "$changed" ] && [ "$matches" -eq 0 ]; then
              dry_runs=skip
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "dry_runs=$dry_runs" >> "$GITHUB_OUTPUT"
          echo "touches code: $code"
          echo "benchmark dry runs: $dry_runs"
      # rustup 1.28 and later no longer install the toolchain on first use;
      # with no argument this installs the one rust-toolchain.toml names.
      - name: Install the toolchain from rust-toolchain.toml
        if: steps.changes.outputs.code == 'true'
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      # Only main saves the cache, so a pull request cannot write an entry
      # that a later run on main restores.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.code == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the dependency policy and unused-dependency checkers
        if: steps.changes.outputs.code == 'true'
        run: |
          bash scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Check formatting, dependencies, lint, real integration tests and the demonstration
        if: steps.changes.outputs.code == 'true'
        env:
          # `skip` or `run`; tests/benchmark_harness.rs skips on `skip` only.
          LANGSPAN_BENCH_DRY_RUNS: ${{ steps.changes.outputs.dry_runs }}
        run: sh scripts/check.sh
  # The same check on Apple silicon. `macos-26` is GitHub's current arm64
  # image (`macos-latest` points at it); a pinned label, so an image change
  # is a deliberate edit here.
  #
  # macOS runners are the costlier and scarcer ones, so this job starts
  # only after Linux passes and only when code changed: most
  # failures show on both, and macOS is kept for what only it finds (it
  # caught the races fixed in #29 and #40). A job skipped this way counts as
  # passed for a required check.
  macos:
    name: macOS
    needs: linux
    if: needs.linux.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup --version
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the dependency policy and unused-dependency checkers
        run: |
          bash scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Check formatting, dependencies, lint, real integration tests and the demonstration
        env:
          # Linux's decision, so both jobs run the same tests.
          LANGSPAN_BENCH_DRY_RUNS: ${{ needs.linux.outputs.dry_runs }}
        run: sh scripts/check.sh
  # A nightly run that fails opens one issue, or comments on it while it is
  # still open, so the failure isn't missed. Only this job can write, and
  # only issues; it checks out nothing and runs no repository code. The
  # title is fixed text and the body only the commit and the run's link.
  nightly-report:
    name: Nightly failure report
    needs: [linux, macos]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly Rust checks on main failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          body=$(printf 'The nightly Rust checks failed on main at %s.\n\nRun: %s\n\nThe nightly run includes the benchmark harness dry runs, which pull requests skip when they touch no benchmark, briefing, hook or daemon code. Fix the failure the same day (docs/development-process.md).' "$SHA" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            # No label: a missing label would fail the create and lose
            # the report.
            gh issue create --title "$TITLE" --body "$body"
          fi
  # zizmor audits the workflows and dependabot.yml: injection, over-broad
  # permissions, credential persistence, unpinned or impostor action
  # commits. Its online audits read public GitHub data with this job's
  # read-only token.
  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.33.1 zizmor --format github .
