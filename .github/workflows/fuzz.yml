name: Fuzz
# Every cargo-fuzz target in fuzz/ for a few minutes each, every night on
# main (fuzz/README.md), or when started by hand. Not a required check, and
# no pull request, merge queue or push runs it (the owner's decision).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
# No token permission unless a job asks for it; only nightly-report writes,
# and only issues.
permissions: {}
env:
  CARGO_INCREMENTAL: 0
  # cargo-fuzz needs a nightly compiler for the sanitizer; pinned so a new
  # nightly can't fail the run on its own.
  FUZZ_TOOLCHAIN: nightly-2026-11-26
  # Seconds each target runs.
  FUZZ_SECONDS: 180
concurrency:
  group: fuzz-${{ github.sha }}
  cancel-in-progress: false
jobs:
  fuzz:
    name: Fuzz
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # One cold build of every target, then 11 targets of 3 minutes each.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-url: ${{ steps.crashes.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      # cargo-fuzz itself needs no nightly, only the targets do. Built on the
      # nightly, the rustix in its lockfile turns on rustc-internal
      # attributes the nightly rejects, so it is built with its own lockfile
      # on the repository's pinned stable toolchain (rust-toolchain.toml).
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.1
      # Fails when fuzz/Cargo.lock is not current, as --locked does for the
      # main build.
      - name: Check fuzz/Cargo.lock is current
        run: cargo +"$FUZZ_TOOLCHAIN" metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Build the targets
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build
      # Each target runs on a copy of its committed seeds, so what libFuzzer
      # adds stays out of the checkout. Every target runs even after one
      # fails; a crash leaves its input in fuzz/artifacts/<target>/.
      - name: Run each target
        run: |
          failed=""
          for target in $(cargo +"$FUZZ_TOOLCHAIN" fuzz list); do
            corpus="$RUNNER_TEMP/corpus/$target"
            mkdir -p "$corpus"
            cp -R "fuzz/corpus/$target/." "$corpus/"
            echo "::group::$target"
            if ! cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" "$corpus" -- -max_total_time="$FUZZ_SECONDS"; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Fuzz targets that failed:$failed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Every fuzz target ran ${FUZZ_SECONDS}s without a crash." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the crashing inputs
        id: crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: warn
          retention-days: 30
  # A failed nightly run opens one issue labelled bug, or comments on it while
  # it is open, so a crash found night after night stays one issue. Only this
  # job can write, and only issues; it checks out nothing and runs no
  # repository code. The body is only the commit, the run's link and the
  # crash artifact's link, never fuzz output.
  nightly-report:
    name: Nightly fuzz report
    needs: [fuzz]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly fuzz run on main failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.fuzz.outputs.artifact-url }}
          SHA: ${{ github.sha }}
        run: |
          # No artifact when the targets did not build or no input was kept.
          artifact="${ARTIFACT_URL:-none, the run kept no crashing input}"
          body=$(printf 'The nightly fuzz run failed on main at %s: a fuzz target crashed, or the targets did not build.\n\nRun: %s\n\nCrash artifact (fuzz-artifacts): %s\n\nThe run summary names the targets that failed, and the artifact holds each crashing input. Reproduce one with `cargo +nightly fuzz run TARGET FILE` (fuzz/README.md), fix the parser, and add the input to that target'"'"'s corpus.' "$SHA" "$RUN_URL" "$artifact")
          number=$(gh issue list --state open --label bug --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label bug --body "$body"
          fi
