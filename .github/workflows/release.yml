name: Release
# release-please (release-please-config.json, .release-please-manifest.json)
# keeps one release pull request open on main with the next version, the
# Cargo.toml and Cargo.lock bump and the CHANGELOG.md section. Merging it
# creates the tag vX.Y.Z at once and a draft Release. The jobs below then build
# the binaries from that tag, run the two-developer demonstration on each,
# write checksums, an SBOM per target and attestations, attach them to the
# draft and publish it. verify-published then downloads each archive, checks
# it and runs the demonstration again; withdraw handles a failure.
# release-fixtures and release-fixtures-pr open the pull request that adds
# the release's golden stores and frozen event-type list.
#
# A draft first, so the assets are attached before anyone sees the release.
# A release is immutable only when the repository setting "Enable release
# immutability" is on; it was off when 0.3.0 was published (isImmutable is
# false), so the owner must turn it on before releases take no more assets.
#
# release-please acts with a short-lived installation token of the project's
# release GitHub App, so the release pull request's pull_request checks run
# like any other pull request's. The app's private key (RELEASE_APP_PRIVATE_KEY)
# is the only long-lived secret; it is used only to mint that token, in the
# release-please job. No workflow runs on tags, so the tag starts nothing.
#
# Every job runs only in the public repository. In any other copy (the
# private one this was written in, or a fork) the whole workflow is skipped.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request, tag and draft Release
    if: github.repository == 'Langspan/LangSpan.dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GITHUB_TOKEN is not used here: release-please acts with the app's token.
    permissions: {}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      # A token for this repository only, revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release branch, the tag and the Release
          permission-pull-requests: write # open and update the release pull request
          permission-issues: write # its labels (autorelease: pending / tagged)
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Fallback from when release-please used GITHUB_TOKEN, whose pull request
  # gets no pull_request run that can pass: start check.yml and content.yml
  # (every required check) on the release branch. Remove this job once a
  # release pull request's own pull_request checks run without approval.
  release-pr-checks:
    name: Start checks on the release pull request
    needs: release-please
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # start check.yml and content.yml; this job only
    steps:
      - name: Start check.yml and content.yml on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.headBranchName // empty' <<< "$PR")
          if [ "$branch" != "release-please--branches--main--components--langspan" ]; then
            echo "Unexpected release branch '$branch'; not starting checks." >&2
            exit 1
          fi
          gh workflow run check.yml --ref "$branch"
          gh workflow run content.yml --ref "$branch"

  # The licence notices of every crate linked into the binaries, once for all
  # four targets. Each archive carries the file.
  notices:
    name: Third-party licence notices
    needs: release-please
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install cargo-about
        run: cargo install --locked cargo-about --version 0.9.3 --features cli
      - name: Generate THIRD-PARTY-LICENSES.html
        run: cargo about generate --locked --fail -c packaging/about.toml packaging/about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: [release-please, notices]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          # Ubuntu 22.04 sets the glibc floor at 2.35.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml, and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # No cache: a release builds from clean. Paths are remapped so the
      # runner's home and checkout do not appear in the binary.
      - name: Build
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$PWD=." \
            cargo build --release --locked --target "$TARGET" --bin langspan
      - name: Version
        run: |
          set -eu
          got=$("./target/$TARGET/release/langspan" --version)
          echo "$got"
          [ "$got" = "langspan ${TAG#v}" ]
      # The binary that is packaged, on its own target's runner. publish
      # needs every build job, so a failure here stops the release while it
      # is still a draft.
      - name: Two-developer demonstration on the release binary
        run: LANGSPAN="target/$TARGET/release/langspan" bash scripts/demo-two-developers.sh
      - name: SBOM (CycloneDX) for this target
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.10
          cargo cyclonedx --format json --spec-version 1.5 --target "$TARGET" --no-build-deps \
            --override-filename "langspan-$TAG-$TARGET.cdx"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Package
        run: |
          set -eu
          name="langspan-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/langspan" LICENSE NOTICE README.md CHANGELOG.md \
            notices/THIRD-PARTY-LICENSES.html "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          mv "$name.cdx.json" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Attestations are made here, not in the build job, so no build script of
  # any dependency runs where the signing token can be requested.
  sbom-attestation:
    name: Attest the SBOM of ${{ matrix.target }}
    needs: [release-please, build]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing
      attestations: write # store the attestation with the repository
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/langspan-${{ env.TAG }}-${{ matrix.target }}.tar.gz
          sbom-path: dist/langspan-${{ env.TAG }}-${{ matrix.target }}.cdx.json

  publish:
    name: Checksums, provenance and publish
    needs: [release-please, build, sbom-attestation]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload assets and publish the draft
      id-token: write # Sigstore signing
      attestations: write # store the attestation with the repository
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true
      # The install script from the tag (docs/install.md#use-the-install-script).
      # Only the file is read; nothing from the checkout runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          cp ../source/scripts/install.sh install.sh
          set -- langspan-*.tar.gz
          [ "$#" -eq 4 ] || { echo "expected 4 archives, found $#: $*" >&2; exit 1; }
          sha256sum langspan-*.tar.gz langspan-*.cdx.json install.sh > SHA256SUMS
          cat SHA256SUMS
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload to the draft Release and publish it
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "dist/langspan-$TAG.sigstore.json"
          gh release upload "$TAG" dist/langspan-*.tar.gz dist/langspan-*.cdx.json dist/install.sh dist/SHA256SUMS \
            "dist/langspan-$TAG.sigstore.json"
          gh release edit "$TAG" --draft=false --latest

  # What the release adds to the tests (issue #566): its golden stores, their
  # state snapshots and its frozen event-type list, built from the tag by
  # scripts/release-fixtures.sh. The tests never ask them of the version main
  # carries, so publishing turns no pull request red; the next release pull
  # request fails until they land. This job builds and runs the tag's code,
  # so it gets no write token: it hands a patch to release-fixtures-pr.
  release-fixtures:
    name: Golden stores and frozen list of the release
    needs: [release-please, publish]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the tag itself, which golden-stores.sh builds from
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml, and sqlite3
        run: |
          rustup toolchain install
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends sqlite3
      - name: Write the fixtures
        run: bash scripts/release-fixtures.sh "${TAG#v}"
      - name: Keep them as a patch
        run: |
          set -eu
          git add -A
          git diff --cached --binary > release-fixtures.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixtures
          path: release-fixtures.patch
          if-no-files-found: error
          retention-days: 7

  # Opens the pull request with release-fixtures' patch, as the release app
  # so its checks run. Nothing from the checkout runs here, and the patch may
  # touch only the paths the script writes.
  release-fixtures-pr:
    name: Open the pull request with the release's fixtures
    needs: [release-please, release-fixtures]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the fixtures branch
          permission-pull-requests: write # open its pull request
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-fixtures
          path: ${{ runner.temp }}/fixtures
      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          PATCH: ${{ runner.temp }}/fixtures/release-fixtures.patch
        run: |
          set -euo pipefail
          version=${TAG#v}
          git apply --index "$PATCH"
          git diff --cached --name-only | while read -r path; do
            case $path in
              "tests/fixtures/store-$version/"* | "fixtures/event-types/$version.txt" | docs/*.md) ;;
              *) echo "the patch touches $path, which release-fixtures.sh does not write" >&2; exit 1 ;;
            esac
          done
          branch="release-fixtures/$TAG"
          git -c user.name="$SLUG[bot]" -c user.email="$SLUG[bot]@users.noreply.github.com" \
            commit -q -m "test: golden stores and frozen event-type list of $TAG (#566)"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "test: golden stores and frozen event-type list of $TAG" --body "$(cat <<EOF
          The release workflow wrote these with \`bash scripts/release-fixtures.sh $version\` on $TAG: the golden stores from that tag's demonstration and build (\`scripts/golden-stores.sh\`), their state snapshots (\`LANGSPAN_UPDATE_GOLDEN=1\` on \`tests/golden_stores.rs\`), the frozen event-type list and the generated table naming it.

          To finish: add the $version row to \`RELEASES\` in \`tests/protocol.rs\` with the protocol version and the capabilities its requests name, review the new state snapshots, and mark this ready. The next release pull request fails until this lands (docs/development-process.md, Releases).
          EOF
          )"

  # What a user gets: the published assets, downloaded on each target's own
  # runner, checked the way docs/install.md says, then run. The targets and
  # runners are the build job's.
  verify-published:
    name: Verify the published ${{ matrix.target }} archive
    needs: [release-please, publish]
    if: github.repository == 'Langspan/LangSpan.dev' && needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read # download the release assets
      attestations: read # gh attestation verify
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the demonstration is taken from the tag; the binary under test
      # and the install script come from the published release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: source
          sparse-checkout: scripts/demo-two-developers.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download, check SHA256SUMS and verify the attestations
        run: |
          set -euo pipefail
          archive="langspan-$TAG-$TARGET.tar.gz"
          mkdir published && cd published
          gh release download "$TAG" --pattern SHA256SUMS --pattern "$archive" \
            --pattern install.sh --pattern "langspan-$TAG.sigstore.json"
          awk -v a="$archive" '$2 == a || $2 == "install.sh"' SHA256SUMS > mine
          [ "$(awk 'END { print NR }' mine)" = 2 ] || { echo "SHA256SUMS lacks $archive or install.sh" >&2; exit 1; }
          if command -v sha256sum >/dev/null; then sha256sum -c mine; else shasum -a 256 -c mine; fi
          workflow="$GH_REPO/.github/workflows/release.yml"
          gh attestation verify "$archive" --repo "$GH_REPO" --signer-workflow "$workflow"
          gh attestation verify "$archive" --repo "$GH_REPO" --signer-workflow "$workflow" \
            --bundle "langspan-$TAG.sigstore.json"
          gh attestation verify "$archive" --repo "$GH_REPO" --signer-workflow "$workflow" \
            --predicate-type https://cyclonedx.org/bom
          tar -xzf "$archive"
      - name: Install with the published install script
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/install-home" sh published/install.sh "$TAG"
          cmp "$RUNNER_TEMP/install-home/.local/bin/langspan" "published/langspan-$TAG-$TARGET/langspan"
          got=$("$RUNNER_TEMP/install-home/.local/bin/langspan" --version)
          echo "$got"
          [ "$got" = "langspan ${TAG#v}" ]
      - name: Two-developer demonstration on the installed binary
        run: LANGSPAN="$RUNNER_TEMP/install-home/.local/bin/langspan" bash source/scripts/demo-two-developers.sh

  # A published release that fails verification stops being the one users
  # get: it is marked a prerelease, the previous release becomes latest
  # again, and an issue links the run. This job checks out and runs nothing
  # from the repository. docs/development-process.md#withdraw-a-release.
  withdraw:
    name: Withdraw a release that failed verification
    needs: [release-please, verify-published]
    if: always() && github.repository == 'Langspan/LangSpan.dev' && needs.verify-published.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # edit the release's prerelease and latest flags
      issues: write # open the issue
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The issue is opened even when an edit fails, and says which happened;
      # the job then fails so the run shows the withdrawal is incomplete.
      - name: Mark the release a prerelease, restore the previous latest and open an issue
        run: |
          set -uo pipefail
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 \
            --json tagName --jq "[.[] | select(.tagName != \"$TAG\")][0].tagName // empty") || previous=
          if gh release edit "$TAG" --prerelease --latest=false &&
            { [ -z "$previous" ] || gh release edit "$previous" --latest; }; then
            outcome="The withdraw job marked $TAG a prerelease and made ${previous:-no earlier release} the latest release."
            status=0
          else
            outcome="The withdraw job could not finish marking $TAG a prerelease and restoring ${previous:-an earlier release} as latest; its log says which edit failed. Do it by hand."
            status=1
          fi
          runbook="$GITHUB_SERVER_URL/$GH_REPO/blob/main/docs/development-process.md#withdraw-a-release"
          gh issue create --title "Release $TAG failed verification after publishing" --body "$(cat <<EOF
          The published $TAG archives failed \`verify-published\`: $RUN_URL

          $outcome Follow [Withdraw a release]($runbook) to find the cause and publish a fix.
          EOF
          )" || status=1
          exit "$status"
