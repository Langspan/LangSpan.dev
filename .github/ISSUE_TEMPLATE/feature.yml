name: Feature request
description: Something LangSpan should do that it does not do today.
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: What you and your agents were doing, and where LangSpan fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
