[package]
name = "langspan-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure event-sourced coordination rules for LangSpan"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
