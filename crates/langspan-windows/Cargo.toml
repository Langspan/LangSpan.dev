[package]
name = "langspan-windows"
version = "0.9.0"
edition = "2024"
rust-version = "1.100"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Win32 calls LangSpan needs on Windows, behind a safe API"

# Empty on every other platform; `langspan` depends on it only on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# The one LangSpan crate that allows `unsafe`: each block is a documented
# Win32 call, and nothing unsafe leaves the crate (see src/lib.rs).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
