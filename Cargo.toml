[workspace]
members = ["crates/langspan-core", "crates/langspan-graph", "crates/langspan-windows"]
resolver = "3"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/Langspan/LangSpan.dev"
homepage = "https://langspan.dev"

[package]
name = "langspan"
version = "0.10.0"
edition = "2024"
rust-version = "1.100"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local cooperative coordination for AI coding agents"

[dependencies]
langspan-core = { path = "crates/langspan-core" }
langspan-graph = { path = "crates/langspan-graph" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "process", "signal", "time"] }
rustix = { version = "=1.1.6", features = ["fs", "process", "net", "event", "time"] }

# Safe wrappers for the Win32 calls LangSpan needs on Windows (#85).
[target.'cfg(windows)'.dependencies]
langspan-windows = { path = "crates/langspan-windows" }

[dev-dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

# Against the real Claude Code CLI; ignored, and the owner runs it (issue #534).
[[test]]
name = "claude_headless"
path = "tests/live/claude_headless.rs"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
